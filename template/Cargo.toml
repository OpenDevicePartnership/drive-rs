{%- assign has_bus = false -%}
{%- if interfaces contains "i2c" or interfaces contains "spi" or interfaces contains "uart" -%}{%- assign has_bus = true -%}{%- endif -%}
{%- assign has_uart = false -%}
{%- if interfaces contains "uart" -%}{%- assign has_uart = true -%}{%- endif -%}
{%- assign has_hal = false -%}
{%- if interfaces contains "gpio" or interfaces contains "i2c" or interfaces contains "spi" -%}{%- assign has_hal = true -%}{%- endif -%}
{%- assign wants_async = false -%}
{%- if mode == "async" or mode == "both" -%}{%- assign wants_async = true -%}{%- endif -%}
[package]
name = "{{ project-name }}"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "An embedded-hal driver for the {{ project-name | pascal_case }}."
license = "MIT OR Apache-2.0"
categories = ["embedded", "no-std", "hardware-support"]
keywords = ["embedded-hal", "driver", "device-driver"]

[dependencies]
{% if has_hal %}embedded-hal = "1.0"
{% endif %}{% if has_hal and wants_async %}embedded-hal-async = "1.0"
{% endif %}{% if has_uart %}embedded-io = "0.7"
{% endif %}{% if has_uart and wants_async %}embedded-io-async = "0.7"
{% endif %}{% if has_bus %}# The register map in `src/registers.rs` is generated ahead of time from
# `device.ddsl` by `ddc`, so only the runtime is needed here (no
# proc-macro, no manifest parsers). Regenerate with:
#   ddc build rust -s device.ddsl -o src/registers.rs --rust-defmt-feature=defmt
device-driver = { version = "2.1.0", default-features = false{% if has_uart %}, features = ["embedded-io-07"]{% endif %} }
{% endif %}defmt = { version = "1", optional = true }

[dev-dependencies]
# Run your driver against real hardware on your laptop over a Pico de Gallo
# USB bridge. See `examples/pico.rs`.
{% if has_uart %}pico-de-gallo-hal = { version = "0.7", default-features = false, features = ["embedded-io-07"] }
{% else %}pico-de-gallo-hal = { version = "0.7", default-features = false }
{% endif %}{% if wants_async %}tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
{% endif %}
[features]
default = []
{% if has_bus %}defmt = ["dep:defmt", "device-driver/defmt"]{% else %}defmt = ["dep:defmt"]{% endif %}
