{%- assign has_registers = false -%}
{%- if interfaces contains "i2c" or interfaces contains "spi" -%}{%- assign has_registers = true -%}{%- endif -%}
# device-driver manifest for the {{ project-name | pascal_case }}.
#
# This is the single source of truth for the register map. Edit it to match
# your device's datasheet, then regenerate `src/registers.rs` with:
#
#     device-driver-cli -m device.yaml -o src/registers.rs -d {{ project-name | pascal_case }}Registers
#
# (`cargo install device-driver-cli` if you don't have it.)

config:
{% if has_registers %}  register_address_type: u8
{% endif %}{% if interfaces contains "uart" %}  buffer_address_type: u8
{% endif %}  default_byte_order: LE
  # defmt impls on the generated types are gated behind the crate's `defmt`
  # feature (see Cargo.toml).
  defmt_feature: defmt
{% if has_registers %}
DeviceId:
  type: register
  access: RO
  address: 0
  size_bits: 8
  description: Read-only device identification register.
  fields:
    id:
      base: uint
      start: 0
      end: 8
      description: Fixed identifier reported by the device.

Config:
  type: register
  access: RW
  address: 1
  size_bits: 8
  reset_value: 0
  description: Primary configuration register.
  fields:
    enable:
      base: bool
      start: 0
      description: Enable the device.
    mode:
      base: uint
      start: 1
      end: 3
      description: Operating mode (0..=3).
{% endif %}{% if interfaces contains "uart" %}
Stream:
  type: buffer
  access: RW
  address: 0
  description: >-
    Raw byte stream to and from the device. Whatever framing the device speaks
    over the wire is decoded in `src/driver.rs`, not here.
{% endif %}