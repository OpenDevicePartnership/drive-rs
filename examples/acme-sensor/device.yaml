# device-driver manifest for the AcmeSensor.
#
# This is the single source of truth for the register map. Edit it to match
# your device's datasheet, then regenerate `src/registers.rs` with:
#
#     device-driver-cli -m device.yaml -o src/registers.rs -d AcmeSensorRegisters
#
# (`cargo install device-driver-cli` if you don't have it.)

config:
  register_address_type: u8
  default_byte_order: LE
  # defmt impls on the generated types are gated behind the crate's `defmt`
  # feature (see Cargo.toml).
  defmt_feature: defmt

DeviceId:
  type: register
  access: RO
  address: 0
  size_bits: 8
  description: Read-only device identification register.
  fields:
    id:
      base: uint
      start: 0
      end: 8
      description: Fixed identifier reported by the device.

Config:
  type: register
  access: RW
  address: 1
  size_bits: 8
  reset_value: 0
  description: Primary configuration register.
  fields:
    enable:
      base: bool
      start: 0
      description: Enable the device.
    mode:
      base: uint
      start: 1
      end: 3
      description: Operating mode (0..=3).
